<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quy trình làm việc đại học</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7285;--bd:#e2e5ee;--ac:#2f5bea;--acs:#e8eeff;--dg:#d33a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1b2030;--tx:#e8ebf4;--mu:#98a0b6;--bd:#2c3347;--ac:#6f93ff;--acs:#232c4d;--dg:#ff7a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151d;--card:#1b2030;--tx:#e8ebf4;--mu:#98a0b6;--bd:#2c3347;--ac:#6f93ff;--acs:#232c4d;--dg:#ff7a7a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:280px 1fr;gap:16px;max-width:1100px;margin:0 auto;padding:16px}
@media(max-width:760px){.app{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 10px}
button:hover{border-color:var(--ac)}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.dg{color:var(--dg)}
.ico{padding:3px 7px;font-size:13px}
input,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
.fl{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--card)}
.fl.on{background:var(--acs);border-color:var(--ac)}
.fl .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grip{cursor:grab;color:var(--mu);user-select:none}
.over{outline:2px dashed var(--ac)}
.drag{opacity:.4}
.title{font-size:20px;font-weight:600;border:1px solid transparent;background:transparent;padding:4px 8px}
.title:hover{border-color:var(--bd)}
.step{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
.body{flex:1;min-width:0}
.own{display:inline-block;font-size:12px;background:var(--acs);color:var(--ac);border-radius:6px;padding:1px 8px;margin-top:2px}
.note{color:var(--mu);font-size:13px;margin-top:4px;white-space:pre-wrap}
.arrow{text-align:center;color:var(--mu);line-height:1.2;margin:3px 0}
.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.form{display:grid;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--bd)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.mu{color:var(--mu);font-size:13px}
.empty{text-align:center;color:var(--mu);padding:24px}
.bar{max-width:1100px;margin:0 auto;padding:12px 16px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:17px;margin:0;flex:1}
.badge{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--acs);color:var(--ac)}
.badge.ro{background:var(--bd);color:var(--mu)}
select{font:inherit;padding:5px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.urow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}
.urow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ro-note{background:var(--acs);color:var(--tx);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);padding:18px;width:min(92vw,380px)}
dialog.wide{width:min(94vw,640px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{display:grid;gap:8px}
.pic{display:block;max-width:100%;max-height:360px;border-radius:8px;margin-top:8px;border:1px solid var(--bd)}
.thumb{height:48px;border-radius:6px;border:1px solid var(--bd);vertical-align:middle}
.imgrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btnlike{border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
.title-ro{font-size:20px;margin:0 0 12px}
html{scroll-behavior:smooth}
button,.fl,.step,.btnlike,input,textarea,select{transition:background-color .2s,border-color .2s,box-shadow .2s,transform .15s,opacity .2s,color .2s}
button:active{transform:scale(.97)}
.fl:hover{border-color:var(--ac);transform:translateX(2px)}
.step:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.enter .step,.enter .arrow,.enter .title-ro{animation:up .35s ease both;animation-delay:calc(var(--i,0)*50ms)}
.step.pop{animation:pop .3s ease}
.out{opacity:0!important;transform:translateY(-6px)!important;transition:opacity .2s,transform .2s!important}
dialog[open]{animation:pop .22s ease}
dialog[open]::backdrop{animation:fade .22s ease}
.pic{opacity:0;transition:opacity .4s}
.pic.ok{opacity:1}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:100;max-width:min(92vw,340px)}
.toast{background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:tin .3s ease;display:flex;gap:8px;align-items:center;font-size:14px}
.toast.err{background:var(--dg);color:#fff}
.toast.bye{opacity:0;transform:translateX(20px);transition:opacity .3s,transform .3s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="bar"><h1>🎓 Quy trình làm việc đại học</h1><span class="badge" id="who" hidden></span>
  <button id="usersBtn" hidden>Phân quyền</button><button id="pwBtn" hidden>Đổi mật khẩu</button><button id="loginBtn">Đăng nhập</button><button id="logoutBtn" hidden>Đăng xuất</button></div>
<div class="app">
  <aside class="card">
    <h2>Danh sách quy trình <button class="pri ico" id="addFlow" hidden>+ Mới</button></h2>
    <div id="flows"></div>
    <div class="mu" id="hint" hidden>Kéo ⠿ để sắp xếp thứ tự quy trình.</div>
  </aside>
  <main class="card" id="main"></main>
</div>

<dialog id="loginDlg"><form class="dlg" id="loginForm">
  <strong>Đăng nhập</strong>
  <input id="lu" placeholder="Tên đăng nhập" autocomplete="username" required>
  <input id="lp" type="password" placeholder="Mật khẩu" autocomplete="current-password" required>
  <div class="dg" id="lerr"></div>
  <div><button class="pri">Đăng nhập</button> <button type="button" data-close>Hủy</button></div>
</form></dialog>

<dialog id="pwDlg"><form class="dlg" id="pwForm">
  <strong>Đổi mật khẩu</strong>
  <input id="pc" type="password" placeholder="Mật khẩu hiện tại" autocomplete="current-password" required>
  <input id="pn" type="password" placeholder="Mật khẩu mới (≥ 6 ký tự)" autocomplete="new-password" required>
  <input id="pn2" type="password" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password" required>
  <div class="dg" id="perr"></div>
  <div><button class="pri">Đổi mật khẩu</button> <button type="button" data-close>Hủy</button></div>
</form></dialog>

<dialog id="usersDlg" class="wide"><div class="dlg">
  <h2>Phân quyền người dùng <button class="ico" data-close>Đóng</button></h2>
  <div class="mu">Viewer: chỉ xem · Editor: thêm/sửa/xóa/kéo thả · Admin: toàn quyền, kể cả quản lý người dùng.</div>
  <div id="ulist"></div>
  <form id="uform" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
    <input id="nu" placeholder="Tên đăng nhập mới" required style="flex:1 1 140px"><input id="np" type="password" placeholder="Mật khẩu (≥ 6 ký tự)" required style="flex:1 1 140px">
    <select id="nr"><option value="viewer">Viewer</option><option value="editor" selected>Editor</option><option value="admin">Admin</option></select>
    <button class="pri">Thêm</button>
  </form>
  <div class="dg" id="uerr"></div>
</div></dialog>

<dialog id="cfDlg"><div class="dlg">
  <strong>Bạn có muốn xóa?</strong>
  <div class="mu" id="cfMsg"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px"><button id="cfNo">Hủy</button><button class="dg" id="cfYes">Xóa</button></div>
</div></dialog>
<div id="toasts" aria-live="polite"></div>

<script>
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={sel:null,flows:[]},me=null,editId=null,saveT,form={img:''},animate=true,newId=null,pendMsg='';
const api=async(url,opt={})=>{
  const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opt});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||('Lỗi '+r.status));
  return d;
};
const myRole=()=>me?.role||'viewer';
const isAdmin=()=>myRole()==='admin';
const canWrite=()=>['admin','editor'].includes(myRole());
const cur=()=>S.flows.find(f=>f.id===S.sel);
const move=(arr,a,b)=>{if(a===b||a<0||b<0||b>=arr.length)return;const [x]=arr.splice(a,1);arr.splice(b,0,x)};
const resetForm=()=>{editId=null;form.img=''};
/* Thông báo (toast), hộp thoại xác nhận và hiệu ứng biến mất */
function toast(msg,type){
  const box=$('toasts'),t=document.createElement('div'),i=document.createElement('span'),m=document.createElement('span');
  t.className='toast'+(type==='err'?' err':'');
  i.textContent=type==='err'?'⚠':'✓';if(type!=='err')i.style.color='#4ade80';
  m.textContent=msg;t.append(i,m);box.appendChild(t);
  while(box.children.length>4)box.firstChild.remove();
  setTimeout(()=>{t.classList.add('bye');setTimeout(()=>t.remove(),320)},type==='err'?4500:2600);
}
function confirmBox(msg){return new Promise(res=>{
  const d=$('cfDlg');let r=false;$('cfMsg').textContent=msg;
  $('cfYes').onclick=()=>{r=true;d.close()};$('cfNo').onclick=()=>d.close();
  d.onclose=()=>res(r);d.showModal();$('cfNo').focus();
})}
const fadeOut=el=>{el.classList.add('out');return new Promise(r=>setTimeout(r,220))};
function persist(msg){
  if(!canWrite())return;if(msg)pendMsg=msg;clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    const m=pendMsg||'Lưu thành công';pendMsg='';
    try{await api('/api/flows',{method:'PUT',body:JSON.stringify({flows:S.flows})});toast(m)}
    catch(e){toast('Không lưu được: '+e.message,'err')}
  },400);
}
function dnd(el,arr,i,after){
  if(!canWrite())return;
  el.draggable=true;
  el.ondragstart=e=>{e.dataTransfer.setData('text/plain',i);e.dataTransfer.effectAllowed='move';setTimeout(()=>el.classList.add('drag'),0);window._from=i;window._arr=arr};
  el.ondragend=()=>el.classList.remove('drag');
  el.ondragover=e=>{if(window._arr===arr){e.preventDefault();el.classList.add('over')}};
  el.ondragleave=()=>el.classList.remove('over');
  el.ondrop=e=>{e.preventDefault();el.classList.remove('over');if(window._arr!==arr)return;move(arr,window._from,i);window._arr=null;after()};
}
/* Nén ảnh trên trình duyệt (tối đa 1000px, JPEG) trước khi tải lên */
async function compress(file){
  const bmp=await createImageBitmap(file),sc=Math.min(1,1000/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
  let q=.8,d;do{d=c.toDataURL('image/jpeg',q);q-=.1}while(d.length>650000&&q>.25);
  return d;
}
const imgUrl=id=>'/api/image?id='+encodeURIComponent(id);

function renderBar(){
  const w=$('who');w.hidden=!(me&&myRole()!=='viewer');
  if(!w.hidden)w.textContent=me.username+' · '+(isAdmin()?'Admin':'Editor');
  $('loginBtn').hidden=!!me;$('logoutBtn').hidden=!me;
  $('pwBtn').hidden=!me||!!me.fixed;
  $('usersBtn').hidden=!isAdmin();$('addFlow').hidden=!canWrite();$('hint').hidden=!canWrite();
}
function renderFlows(){
  const box=$('flows'),w=canWrite();box.innerHTML='';
  S.flows.forEach((f,i)=>{
    const d=document.createElement('div');d.className='fl'+(f.id===S.sel?' on':'');
    d.innerHTML=`${w?'<span class="grip">⠿</span>':''}<span class="t">${esc(f.title||'(chưa đặt tên)')}</span>${w?`<span class="mu">${f.steps.length}</span>`:''}`;
    d.onclick=()=>{S.sel=f.id;resetForm();animate=true;render()};
    dnd(d,S.flows,i,()=>{persist();render()});box.appendChild(d);
  });
  if(!S.flows.length)box.innerHTML='<div class="empty">Chưa có quy trình nào.</div>';
}
function prevHTML(){return form.img?`<img class="thumb" src="${imgUrl(form.img)}" alt=""> <button type="button" class="ico dg" id="rmImg">Xóa hình</button>`:''}
function renderMain(){
  const m=$('main'),f=cur(),w=canWrite();
  m.classList.remove('out');m.classList.toggle('enter',animate);
  if(!f){m.innerHTML='<div class="empty">'+(w?'Chọn hoặc tạo một quy trình để bắt đầu.':'Chưa có quy trình nào.')+'</div>';return}
  const es=editId?f.steps.find(s=>s.id===editId):null;
  m.innerHTML=`${w?`<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
    <input class="title" id="ttl" placeholder="Nhập tiêu đề quy trình…" value="${esc(f.title)}">
    <button class="dg" id="df">Xóa quy trình</button></div>`
    :`<h2 class="title-ro">${esc(f.title)}</h2>`}
  <div id="steps"></div>
  ${w?`<div class="form"><strong>${es?'Sửa bước':'Thêm bước mới'}</strong>
    <div class="row"><input id="sn" placeholder="Tên bước *" value="${esc(es?.name)}"><input id="so" placeholder="Đơn vị / người phụ trách" value="${esc(es?.owner)}"></div>
    <textarea id="sd" rows="2" placeholder="Ghi chú, hồ sơ cần có…">${esc(es?.note)}</textarea>
    <div class="imgrow"><label class="btnlike">📷 Chọn hình minh họa<input type="file" id="sf" accept="image/*" hidden></label><span id="imgPrev">${prevHTML()}</span><span class="mu">(không bắt buộc)</span></div>
    <div><button class="pri" id="ok">${es?'Lưu thay đổi':'+ Thêm bước'}</button> ${es?'<button id="cx">Hủy</button>':''}</div></div>`:''}`;
  const list=m.querySelector('#steps');
  if(!f.steps.length)list.innerHTML='<div class="empty">Chưa có bước nào.</div>';
  f.steps.forEach((s,i)=>{
    if(i)list.insertAdjacentHTML('beforeend','<div class="arrow">↓</div>');
    const d=document.createElement('div');d.className='step'+(s.id===newId?' pop':'');d.style.setProperty('--i',i);
    d.innerHTML=`${w?'<span class="grip" title="Kéo để đổi thứ tự">⠿</span>':''}<div class="num">${i+1}</div>
      <div class="body"><div><strong>${esc(s.name)}</strong></div>${s.owner?`<span class="own">${esc(s.owner)}</span>`:''}${s.note?`<div class="note">${esc(s.note)}</div>`:''}
      ${s.img?`<a href="${imgUrl(s.img)}" target="_blank" rel="noopener"><img class="pic" onload="this.classList.add('ok')" loading="lazy" src="${imgUrl(s.img)}" alt="${esc(s.name)}"></a>`:''}</div>
      ${w?`<div class="acts"><button class="ico" data-a="up">▲</button><button class="ico" data-a="dn">▼</button><button class="ico" data-a="ed">Sửa</button>
      <button class="ico dg" data-a="del">Xóa</button></div>`:''}`;
    d.querySelectorAll('button').forEach(b=>b.onclick=async()=>{
      const a=b.dataset.a;
      if(a==='del'){
        if(!await confirmBox('Bạn có muốn xóa bước “'+s.name+'”?'))return;
        await fadeOut(d);f.steps.splice(i,1);if(editId===s.id)resetForm();persist('Xóa thành công');render();return;
      }
      if(a==='up'||a==='dn'){const j=a==='up'?i-1:i+1;if(j<0||j>=f.steps.length)return;move(f.steps,i,j);persist('Lưu thành công')}
      if(a==='ed'){editId=s.id;form.img=s.img||''}
      render();
    });
    dnd(d,f.steps,i,()=>{persist();render()});list.appendChild(d);
  });
  if(!w)return;
  const q=s=>m.querySelector(s);
  q('#ttl').onchange=e=>{f.title=e.target.value;persist('Lưu thành công');renderFlows()};
  q('#df').onclick=async()=>{
    if(!await confirmBox('Bạn có muốn xóa quy trình “'+(f.title||'chưa đặt tên')+'” cùng toàn bộ các bước?'))return;
    await fadeOut(m);S.flows=S.flows.filter(x=>x.id!==f.id);S.sel=S.flows[0]?.id||null;resetForm();animate=true;persist('Xóa thành công');render();
  };
  if(q('#cx'))q('#cx').onclick=()=>{resetForm();render()};
  const setPrev=()=>{q('#imgPrev').innerHTML=prevHTML();const r=q('#rmImg');if(r)r.onclick=()=>{form.img='';setPrev()}};setPrev();
  q('#sf').onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    q('#imgPrev').textContent='Đang tải ảnh…';
    try{const r=await api('/api/image',{method:'POST',body:JSON.stringify({data:await compress(file)})});form.img=r.id}
    catch(x){toast('Không tải được ảnh: '+x.message,'err')}
    e.target.value='';setPrev();
  };
  q('#ok').onclick=()=>{
    const name=q('#sn').value.trim();if(!name){q('#sn').focus();return}
    const owner=q('#so').value.trim(),note=q('#sd').value.trim(),img=form.img;
    let msg='Lưu thành công';
    if(es){Object.assign(es,{name,owner,note,img})}
    else{const id=uid();newId=id;f.steps.push({id,name,owner,note,img});msg='Thêm bước thành công'}
    resetForm();persist(msg);render();
  };
}
function render(){renderBar();renderFlows();renderMain();animate=false;newId=null}
$('addFlow').onclick=()=>{
  const f={id:uid(),title:'Quy trình mới',steps:[]};S.flows.push(f);S.sel=f.id;resetForm();animate=true;persist('Thêm quy trình thành công');render();
  const t=$('ttl');if(t){t.focus();t.select()}
};

/* Hộp thoại (modal) */
document.querySelectorAll('dialog').forEach(d=>{
  d.addEventListener('click',e=>{if(e.target===d)d.close()});
  d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>d.close());
});
$('loginBtn').onclick=()=>{$('lerr').textContent='';$('loginDlg').showModal();$('lu').focus()};
$('loginForm').onsubmit=async e=>{
  e.preventDefault();$('lerr').textContent='';
  try{const d=await api('/api/auth?action=login',{method:'POST',body:JSON.stringify({username:$('lu').value.trim(),password:$('lp').value})});
    me=d.user;$('lp').value='';$('loginDlg').close();render();toast('Đăng nhập thành công')}
  catch(x){$('lerr').textContent=x.message}
};
$('logoutBtn').onclick=async()=>{await api('/api/auth?action=logout');me=null;document.querySelectorAll('dialog').forEach(d=>d.close());resetForm();render()};

/* Đổi mật khẩu (mọi tài khoản đã đăng nhập) */
$('pwBtn').onclick=()=>{$('pwForm').reset();$('perr').textContent='';$('pwDlg').showModal();$('pc').focus()};
$('pwForm').onsubmit=async e=>{
  e.preventDefault();$('perr').textContent='';
  if($('pn').value!==$('pn2').value){$('perr').textContent='Mật khẩu nhập lại không khớp';return}
  try{await api('/api/auth?action=password',{method:'POST',body:JSON.stringify({current:$('pc').value,next:$('pn').value})});
    $('pwDlg').close();toast('Đổi mật khẩu thành công')}
  catch(x){$('perr').textContent=x.message}
};

/* Phân quyền (chỉ Admin) */
async function renderUsers(){
  if(!$('usersDlg').open)return;
  const box=$('ulist');
  try{
    const {users}=await api('/api/users');box.innerHTML='';
    if(!users.length)box.innerHTML='<div class="mu">Chưa có người dùng nào. Thêm ở bên dưới.</div>';
    users.forEach(u=>{
      const d=document.createElement('div');d.className='urow';
      const n=document.createElement('span');n.textContent=u.username;
      const sel=document.createElement('select');
      [['viewer','Viewer'],['editor','Editor'],['admin','Admin']].forEach(([v,t])=>{const o=new Option(t,v);o.selected=v===u.role;sel.add(o)});
      sel.onchange=()=>saveUser(u.username,'',sel.value);
      const pw=document.createElement('button');pw.className='ico';pw.textContent='Đặt lại mật khẩu';
      pw.onclick=()=>{const p=prompt('Mật khẩu mới cho '+u.username+' (≥ 6 ký tự):');if(p)saveUser(u.username,p,sel.value)};
      const del=document.createElement('button');del.className='ico dg';del.textContent='Xóa';
      del.onclick=async()=>{if(!await confirmBox('Bạn có muốn xóa tài khoản '+u.username+'?'))return;try{await api('/api/users?username='+encodeURIComponent(u.username),{method:'DELETE'});toast('Xóa thành công');renderUsers()}catch(e){toast(e.message,'err')}};
      d.append(n,sel,pw,del);box.appendChild(d);
    });
  }catch(e){box.textContent=e.message}
}
async function saveUser(username,password,role,msg='Lưu thành công'){
  $('uerr').textContent='';
  try{await api('/api/users',{method:'POST',body:JSON.stringify({username,password,role})});toast(msg);renderUsers()}
  catch(e){$('uerr').textContent=e.message;renderUsers()}
}
$('usersBtn').onclick=()=>{$('usersDlg').showModal();renderUsers()};
$('uform').onsubmit=async e=>{e.preventDefault();await saveUser($('nu').value.trim(),$('np').value,$('nr').value,'Thêm người dùng thành công');if(!$('uerr').textContent){$('nu').value=$('np').value=''}};

/* Khởi động */
async function load(){
  try{
    const [a,f]=await Promise.all([api('/api/auth?action=me'),api('/api/flows')]);
    me=a.user;S.flows=f.flows;if(!S.flows.find(x=>x.id===S.sel))S.sel=S.flows[0]?.id||null;
  }catch(e){$('main').innerHTML='<div class="empty">Không tải được dữ liệu: '+esc(e.message)+'</div>';return}
  render();
}
load();
window.addEventListener('focus',()=>{if(!canWrite())load()});
</script>
