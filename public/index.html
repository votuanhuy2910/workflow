<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quy trình làm việc đại học</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7285;--bd:#e2e5ee;--ac:#2f5bea;--acs:#e8eeff;--dg:#d33a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1b2030;--tx:#e8ebf4;--mu:#98a0b6;--bd:#2c3347;--ac:#6f93ff;--acs:#232c4d;--dg:#ff7a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151d;--card:#1b2030;--tx:#e8ebf4;--mu:#98a0b6;--bd:#2c3347;--ac:#6f93ff;--acs:#232c4d;--dg:#ff7a7a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:280px 1fr;gap:16px;max-width:1100px;margin:0 auto;padding:16px}
@media(max-width:760px){.app{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 10px}
button:hover{border-color:var(--ac)}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.dg{color:var(--dg)}
.ico{padding:3px 7px;font-size:13px}
input,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
.fl{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--card)}
.fl.on{background:var(--acs);border-color:var(--ac)}
.fl .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grip{cursor:grab;color:var(--mu);user-select:none}
.over{outline:2px dashed var(--ac)}
.drag{opacity:.4}
.title{font-size:20px;font-weight:600;border:1px solid transparent;background:transparent;padding:4px 8px}
.title:hover{border-color:var(--bd)}
.step{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
.body{flex:1;min-width:0}
.own{display:inline-block;font-size:12px;background:var(--acs);color:var(--ac);border-radius:6px;padding:1px 8px;margin-top:2px}
.note{color:var(--mu);font-size:13px;margin-top:4px;white-space:pre-wrap}
.arrow{text-align:center;color:var(--mu);line-height:1.2;margin:3px 0}
.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.form{display:grid;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--bd)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.mu{color:var(--mu);font-size:13px}
.empty{text-align:center;color:var(--mu);padding:24px}
.bar{max-width:1100px;margin:0 auto;padding:12px 16px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:17px;margin:0;flex:1}
.badge{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--acs);color:var(--ac)}
.badge.ro{background:var(--bd);color:var(--mu)}
select{font:inherit;padding:5px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.urow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}
.urow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ro-note{background:var(--acs);color:var(--tx);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
</style>
</head>
<body>
<div class="bar"><h1>🎓 Quy trình làm việc đại học</h1><span class="badge ro" id="who">Đang tải…</span><button id="usersBtn" hidden>Phân quyền</button><button id="loginBtn">Đăng nhập</button><button id="logoutBtn" hidden>Đăng xuất</button></div>
<div class="app" id="loginWrap" hidden style="grid-template-columns:1fr;padding-bottom:0">
  <form class="card" id="loginForm" style="display:grid;gap:8px;max-width:360px">
    <strong>Đăng nhập</strong>
    <input id="lu" placeholder="Tên đăng nhập" autocomplete="username" required>
    <input id="lp" type="password" placeholder="Mật khẩu" autocomplete="current-password" required>
    <div class="dg" id="lerr"></div>
    <div><button class="pri">Đăng nhập</button> <button type="button" id="lcancel">Hủy</button></div>
  </form>
</div>
<div class="app">
  <aside class="card">
    <h2>Danh sách quy trình <button class="pri ico" id="addFlow" hidden>+ Mới</button></h2>
    <div id="flows"></div>
    <div class="mu" id="hint"></div>
  </aside>
  <main class="card" id="main"></main>
</div>
<div class="app" id="usersWrap" hidden style="padding-top:0;grid-template-columns:1fr"><section class="card">
  <h2>Phân quyền người dùng <button class="ico" id="usersClose">Đóng</button></h2>
  <div class="mu" style="margin-bottom:8px">Viewer: chỉ xem · Editor: thêm/sửa/xóa/kéo thả · Admin: toàn quyền, kể cả quản lý người dùng.</div>
  <div id="ulist"></div>
  <form id="uform" class="row" style="margin-top:12px;grid-template-columns:1fr 1fr auto auto">
    <input id="nu" placeholder="Tên đăng nhập mới" required><input id="np" type="password" placeholder="Mật khẩu (≥ 6 ký tự)" required>
    <select id="nr"><option value="viewer">Viewer</option><option value="editor" selected>Editor</option><option value="admin">Admin</option></select>
    <button class="pri">Thêm</button>
  </form>
  <div class="dg" id="uerr"></div>
</section></div>
<script>
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={sel:null,flows:[]},me=null,editId=null,delStep=null,delFlow=null,saveT;
const api=async(url,opt={})=>{
  const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opt});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||('Lỗi '+r.status));
  return d;
};
const myRole=()=>me?.role||'viewer';
const isAdmin=()=>myRole()==='admin';
const canWrite=()=>['admin','editor'].includes(myRole());
const cur=()=>S.flows.find(f=>f.id===S.sel);
const move=(arr,a,b)=>{if(a===b||a<0||b<0||b>=arr.length)return;const [x]=arr.splice(a,1);arr.splice(b,0,x)};
function persist(){
  if(!canWrite())return;clearTimeout(saveT);
  saveT=setTimeout(()=>api('/api/flows',{method:'PUT',body:JSON.stringify({flows:S.flows})}).catch(e=>alert('Không lưu được: '+e.message)),400);
}
function dnd(el,arr,i,after){
  if(!canWrite())return;
  el.draggable=true;
  el.ondragstart=e=>{e.dataTransfer.setData('text/plain',i);e.dataTransfer.effectAllowed='move';setTimeout(()=>el.classList.add('drag'),0);window._from=i;window._arr=arr};
  el.ondragend=()=>el.classList.remove('drag');
  el.ondragover=e=>{if(window._arr===arr){e.preventDefault();el.classList.add('over')}};
  el.ondragleave=()=>el.classList.remove('over');
  el.ondrop=e=>{e.preventDefault();el.classList.remove('over');if(window._arr!==arr)return;move(arr,window._from,i);window._arr=null;after()};
}
function renderBar(){
  const w=$('who');
  if(!me){w.textContent='Chưa đăng nhập · chỉ xem';w.className='badge ro'}
  else{w.textContent=me.username+' · '+({admin:'Admin',editor:'Editor',viewer:'Viewer'}[me.role]);w.className='badge'+(me.role==='viewer'?' ro':'')}
  $('loginBtn').hidden=!!me;$('logoutBtn').hidden=!me;
  $('usersBtn').hidden=!isAdmin();$('addFlow').hidden=!canWrite();
  $('hint').textContent=canWrite()?'Kéo ⠿ để sắp xếp thứ tự quy trình.':'';
}
function renderFlows(){
  const box=$('flows');box.innerHTML='';
  S.flows.forEach((f,i)=>{
    const d=document.createElement('div');d.className='fl'+(f.id===S.sel?' on':'');
    d.innerHTML=`${canWrite()?'<span class="grip">⠿</span>':''}<span class="t">${esc(f.title||'(chưa đặt tên)')}</span><span class="mu">${f.steps.length}</span>`;
    d.onclick=()=>{S.sel=f.id;editId=delStep=delFlow=null;render()};
    dnd(d,S.flows,i,()=>{persist();render()});box.appendChild(d);
  });
  if(!S.flows.length)box.innerHTML='<div class="empty">Chưa có quy trình nào.</div>';
}
function renderMain(){
  const m=$('main'),f=cur(),w=canWrite();
  if(!f){m.innerHTML='<div class="empty">Chọn hoặc tạo một quy trình để bắt đầu.</div>';return}
  const es=editId?f.steps.find(s=>s.id===editId):null;
  m.innerHTML=`${w?'':`<div class="ro-note">${me?'Bạn đang ở quyền Viewer: chỉ xem. Hãy nhờ Admin cấp quyền Editor để chỉnh sửa.':'Bạn chưa đăng nhập nên chỉ xem được. Bấm “Đăng nhập” nếu bạn có tài khoản.'}</div>`}
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
    <input class="title" id="ttl" placeholder="Nhập tiêu đề quy trình…" value="${esc(f.title)}" ${w?'':'disabled'}>
    ${!w?'':delFlow===f.id?'<button class="dg" id="dfY">Xóa thật?</button><button id="dfN">Hủy</button>':'<button class="dg" id="df">Xóa quy trình</button>'}
  </div>
  <div id="steps"></div>
  ${w?`<div class="form"><strong>${es?'Sửa bước':'Thêm bước mới'}</strong>
    <div class="row"><input id="sn" placeholder="Tên bước *" value="${esc(es?.name)}"><input id="so" placeholder="Đơn vị / người phụ trách" value="${esc(es?.owner)}"></div>
    <textarea id="sd" rows="2" placeholder="Ghi chú, hồ sơ cần có…">${esc(es?.note)}</textarea>
    <div><button class="pri" id="ok">${es?'Lưu thay đổi':'+ Thêm bước'}</button> ${es?'<button id="cx">Hủy</button>':''}</div></div>`:''}`;
  const list=m.querySelector('#steps');
  if(!f.steps.length)list.innerHTML='<div class="empty">Chưa có bước nào.</div>';
  f.steps.forEach((s,i)=>{
    if(i)list.insertAdjacentHTML('beforeend','<div class="arrow">↓</div>');
    const d=document.createElement('div');d.className='step';
    d.innerHTML=`${w?'<span class="grip" title="Kéo để đổi thứ tự">⠿</span>':''}<div class="num">${i+1}</div>
      <div class="body"><div><strong>${esc(s.name)}</strong></div>${s.owner?`<span class="own">${esc(s.owner)}</span>`:''}${s.note?`<div class="note">${esc(s.note)}</div>`:''}</div>
      ${w?`<div class="acts"><button class="ico" data-a="up">▲</button><button class="ico" data-a="dn">▼</button><button class="ico" data-a="ed">Sửa</button>
      ${delStep===s.id?'<button class="ico dg" data-a="dy">Xóa thật?</button>':'<button class="ico dg" data-a="del">Xóa</button>'}</div>`:''}`;
    d.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const a=b.dataset.a;
      if(a==='up')move(f.steps,i,i-1);
      if(a==='dn')move(f.steps,i,i+1);
      if(a==='ed')editId=s.id;
      if(a==='del')delStep=s.id;
      if(a==='dy'){f.steps.splice(i,1);delStep=null;if(editId===s.id)editId=null}
      persist();render();
    });
    dnd(d,f.steps,i,()=>{persist();render()});list.appendChild(d);
  });
  if(!w)return;
  const q=s=>m.querySelector(s);
  q('#ttl').onchange=e=>{f.title=e.target.value;persist();renderFlows()};
  if(q('#df'))q('#df').onclick=()=>{delFlow=f.id;render()};
  if(q('#dfN'))q('#dfN').onclick=()=>{delFlow=null;render()};
  if(q('#dfY'))q('#dfY').onclick=()=>{S.flows=S.flows.filter(x=>x.id!==f.id);S.sel=S.flows[0]?.id||null;delFlow=editId=null;persist();render()};
  if(q('#cx'))q('#cx').onclick=()=>{editId=null;render()};
  q('#ok').onclick=()=>{
    const name=q('#sn').value.trim();if(!name){q('#sn').focus();return}
    const owner=q('#so').value.trim(),note=q('#sd').value.trim();
    if(es){Object.assign(es,{name,owner,note});editId=null}else f.steps.push({id:uid(),name,owner,note});
    persist();render();
  };
}
function render(){renderBar();renderFlows();renderMain()}
$('addFlow').onclick=()=>{
  const f={id:uid(),title:'Quy trình mới',steps:[]};S.flows.push(f);S.sel=f.id;editId=null;persist();render();
  const t=$('ttl');if(t){t.focus();t.select()}
};

/* Đăng nhập / đăng xuất */
$('loginBtn').onclick=()=>{$('loginWrap').hidden=false;$('lu').focus()};
$('lcancel').onclick=()=>{$('loginWrap').hidden=true};
$('loginForm').onsubmit=async e=>{
  e.preventDefault();$('lerr').textContent='';
  try{const d=await api('/api/auth?action=login',{method:'POST',body:JSON.stringify({username:$('lu').value.trim(),password:$('lp').value})});
    me=d.user;$('lp').value='';$('loginWrap').hidden=true;render()}
  catch(x){$('lerr').textContent=x.message}
};
$('logoutBtn').onclick=async()=>{await api('/api/auth?action=logout');me=null;$('usersWrap').hidden=true;render()};

/* Phân quyền */
async function renderUsers(){
  if($('usersWrap').hidden)return;
  const box=$('ulist');
  try{
    const {users}=await api('/api/users');box.innerHTML='';
    if(!users.length)box.innerHTML='<div class="mu">Chưa có người dùng nào. Thêm ở bên dưới.</div>';
    users.forEach(u=>{
      const d=document.createElement('div');d.className='urow';
      const n=document.createElement('span');n.textContent=u.username;
      const sel=document.createElement('select');
      [['viewer','Viewer'],['editor','Editor'],['admin','Admin']].forEach(([v,t])=>{const o=new Option(t,v);o.selected=v===u.role;sel.add(o)});
      sel.onchange=()=>saveUser(u.username,'',sel.value);
      const pw=document.createElement('button');pw.className='ico';pw.textContent='Đổi mật khẩu';
      pw.onclick=()=>{const p=prompt('Mật khẩu mới cho '+u.username+' (≥ 6 ký tự):');if(p)saveUser(u.username,p,sel.value)};
      const del=document.createElement('button');del.className='ico dg';del.textContent='Xóa';
      del.onclick=async()=>{if(confirm('Xóa tài khoản '+u.username+'?')){await api('/api/users?username='+encodeURIComponent(u.username),{method:'DELETE'});renderUsers()}};
      d.append(n,sel,pw,del);box.appendChild(d);
    });
  }catch(e){box.textContent=e.message}
}
async function saveUser(username,password,role){
  $('uerr').textContent='';
  try{await api('/api/users',{method:'POST',body:JSON.stringify({username,password,role})});renderUsers()}
  catch(e){$('uerr').textContent=e.message;renderUsers()}
}
$('usersBtn').onclick=()=>{$('usersWrap').hidden=false;renderUsers()};
$('usersClose').onclick=()=>{$('usersWrap').hidden=true};
$('uform').onsubmit=async e=>{e.preventDefault();await saveUser($('nu').value.trim(),$('np').value,$('nr').value);if(!$('uerr').textContent){$('nu').value=$('np').value=''}};

/* Khởi động */
async function load(){
  try{
    const [a,f]=await Promise.all([api('/api/auth?action=me'),api('/api/flows')]);
    me=a.user;S.flows=f.flows;if(!S.flows.find(x=>x.id===S.sel))S.sel=S.flows[0]?.id||null;
  }catch(e){$('main').innerHTML='<div class="empty">Không tải được dữ liệu: '+esc(e.message)+'</div>';return}
  render();
}
load();
window.addEventListener('focus',()=>{if(!canWrite())load()});
</script>
</body>
</html>
